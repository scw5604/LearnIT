spring.application.name=rapidtutor
spring.datasource.url=jdbc:h2:file:./data/rapidtutor
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

groq.api.key=${GROQ_API_KEY:mock-key}
groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
groq.api.base-url=${GROQ_API_BASE_URL:https://api.groq.com/openai/v1/chat/completions}

# Local accounts stay off unless application-local.properties sets this to true.
rapidtutor.demo-users.enabled=false

spring.config.import=optional:file:./application-local.properties
