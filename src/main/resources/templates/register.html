<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RapidTutor - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
<div class="container">
    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white text-center py-3 border-bottom-0 rounded-top">
                    <h4 class="mb-0 fw-bold">Join RapidTutor</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.error}" class="alert alert-danger small shadow-sm">
                        That username is already taken. Please choose another.
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small text-uppercase">Username</label>
                            <input type="text" class="form-control bg-light" th:field="*{username}" required placeholder="student2">
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Password</label>
                            <input type="password" class="form-control bg-light" th:field="*{password}" required placeholder="••••••••">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Create Account</button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted small">Already have an account?</span>
                        <a th:href="@{/login}" class="text-decoration-none fw-bold small ms-1">Log in here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
