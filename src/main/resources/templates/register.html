<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RapidTutor · Create account')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-auth-wrap">
                <div class="rt-panel">
                    <h1>Create a student account</h1>
                    <p class="text-muted mb-4">New accounts start with 100 tokens.</p>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        That username is already taken. Choose another.
                    </div>

                    <form th:action="@{/register}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input id="username" type="text" class="form-control" th:field="*{username}" required placeholder="student2">
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input id="password" type="password" class="form-control" th:field="*{password}" required>
                        </div>
                        <button type="submit" class="btn btn-rt-primary w-100">Create account</button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        <span class="text-muted">Already registered?</span>
                        <a th:href="@{/login}">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
