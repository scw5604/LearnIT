<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RapidTutor - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-dark text-white text-center py-3 border-bottom-0 rounded-top">
                    <h4 class="mb-0 fw-bold">RapidTutor Login</h4>
                </div>
                <div class="card-body p-4">

                    <div th:if="${param.error}" class="alert alert-danger small shadow-sm">
                        Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info small shadow-sm">
                        You have been logged out successfully.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success small shadow-sm">
                        Account created! Please log in.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted small text-uppercase">Username</label>
                            <input type="text" class="form-control bg-light" name="username" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted small text-uppercase">Password</label>
                            <input type="password" class="form-control bg-light" name="password" required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 fw-bold py-2 shadow-sm">Sign In</button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted small">Don't have an account?</span>
                        <a th:href="@{/register}" class="text-decoration-none fw-bold small ms-1">Sign up here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
