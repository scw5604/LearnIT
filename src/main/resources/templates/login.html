<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RapidTutor · Sign in')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-auth-wrap">
                <div class="rt-panel">
                    <h1>Sign in</h1>
                    <p class="text-muted mb-4">Students, tutors, and admins use the same page.</p>

                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Invalid username or password.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info" role="alert">
                        You have been signed out.
                    </div>
                    <div th:if="${param.registered}" class="alert alert-success" role="alert">
                        Account created. Sign in to continue.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input id="username" type="text" class="form-control" name="username" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input id="password" type="password" class="form-control" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-rt-primary w-100">Sign in</button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        <span class="text-muted">Need a student account?</span>
                        <a th:href="@{/register}">Create one</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
