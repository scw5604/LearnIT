<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('LearnIT · Application')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-auth-wrap">
                <div class="rt-panel">
                    <h1>Tutor application</h1>
                    <p th:if="${applicant != null and applicant.role == 'APPLICANT'}">
                        Your application is waiting for an administrator. Courses:
                        <span th:text="${applicant.appliedSubjects}">HCDD 412</span>.
                    </p>
                    <p th:if="${applicant != null and applicant.role == 'DECLINED'}">
                        Your tutor application was declined.
                    </p>
                    <p th:if="${applicant != null and applicant.role == 'TUTOR'}">
                        You are approved. Sign in again to open the board.
                    </p>
                    <form th:if="${applicant != null and applicant.role == 'TUTOR'}" th:action="@{/logout}" method="post" class="mt-3 mb-0">
                        <button type="submit" class="btn btn-rt-primary">Sign out</button>
                    </form>
                    <p class="mb-0" th:if="${applicant == null}">Sign in to see your application.</p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
