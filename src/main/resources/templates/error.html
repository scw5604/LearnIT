<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('LearnIT · Something went wrong')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-auth-wrap">
                <div class="rt-panel">
                    <h1 th:text="${status == 404 ? 'Page not found' : (status == 403 or status == 401 ? 'Not allowed' : 'Something went wrong')}">Something went wrong</h1>
                    <p th:if="${status == 404}">That page does not exist.</p>
                    <p th:if="${status == 403 or status == 401}">Your account cannot open that page.</p>
                    <p th:unless="${status == 404 or status == 403 or status == 401}">The server could not finish that request. Go back and try again.</p>
                    <p class="mb-0">Use the LearnIT link at the top to get back to your home page.</p>
                    <p class="text-muted small mt-3 mb-0" th:if="${status != null}" th:text="${'Error ' + status}">Error 500</p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
