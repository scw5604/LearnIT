<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RapidTutor · Change password')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-auth-wrap">
                <div class="rt-panel">
                    <h1>Change password</h1>
                    <p class="text-muted mb-4" th:if="${mustChange}">Set a new password before you continue.</p>
                    <p class="text-muted mb-4" th:if="${!mustChange}">Use your current password to choose a new one.</p>

                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <form th:action="@{/account/password}" th:object="${accountForm}" method="post" accept-charset="UTF-8">
                        <div class="mb-3">
                            <label class="form-label" for="currentPassword">Current password</label>
                            <input id="currentPassword" type="password" class="form-control" th:field="*{currentPassword}" required autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">New password</label>
                            <input id="password" type="password" class="form-control" th:field="*{password}" required minlength="10" autocomplete="new-password">
                            <div class="form-text">At least 10 characters, and different from your username and email.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirmPassword">Confirm password</label>
                            <input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}" required minlength="10" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-rt-primary w-100">Save password</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
