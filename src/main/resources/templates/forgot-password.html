<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('LearnIT · Reset password')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-auth-wrap">
                <div class="rt-panel">
                    <h1>Reset password</h1>
                    <p class="text-muted mb-4">Use the email and recovery code from when the account was created.</p>

                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <form th:action="@{/forgot-password}" th:object="${accountForm}" method="post" accept-charset="UTF-8">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input id="email" type="email" class="form-control" th:field="*{email}" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="recoveryCode">Recovery code</label>
                            <input id="recoveryCode" type="text" class="form-control" th:field="*{recoveryCode}" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">New password</label>
                            <input id="password" type="password" class="form-control" th:field="*{password}" required minlength="10" autocomplete="new-password">
                        </div>
                        <div class="mb-4">
                            <label class="form-label" for="confirmPassword">Confirm password</label>
                            <input id="confirmPassword" type="password" class="form-control" th:field="*{confirmPassword}" required minlength="10" autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-rt-primary w-100">Set new password</button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        <a th:href="@{/login}">Back to sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
