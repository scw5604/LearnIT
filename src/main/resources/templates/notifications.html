<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('LearnIT · Notifications')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-page-header">
                <div>
                    <h1>Notifications</h1>
                    <p>Offers, acceptances, cancellations, and meeting-time changes.</p>
                </div>
            </div>

            <div class="rt-card">
                <p class="rt-empty" th:if="${#lists.isEmpty(notifications)}">No notifications yet.</p>
                <ul class="rt-feed" th:if="${!#lists.isEmpty(notifications)}">
                    <li class="rt-feed-item" th:each="note : ${notifications}" th:classappend="${note.readAt == null} ? 'is-unread'">
                        <div>
                            <div>
                                <form th:if="${note.readAt == null and note.link != null}"
                                      th:action="@{/notifications/{id}/read(id=${note.id})}" method="post" class="m-0">
                                    <input type="hidden" name="follow" value="true">
                                    <button type="submit" class="rt-feed-message btn btn-link p-0" th:text="${note.message}">Update</button>
                                </form>
                                <a class="rt-feed-message" th:if="${note.readAt != null and note.link != null}"
                                   th:href="${note.link}" th:text="${note.message}">Update</a>
                                <span class="rt-feed-message" th:if="${note.link == null}" th:text="${note.message}">Update</span>
                            </div>
                            <div class="rt-feed-time" th:text="${#temporals.format(note.createdAt, 'MMM d, h:mm a')}">Oct 15, 4:00 PM</div>
                        </div>
                        <form th:if="${note.readAt == null}" th:action="@{/notifications/{id}/read(id=${note.id})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-sm btn-rt-ghost">Mark read</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
