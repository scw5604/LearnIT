<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RapidTutor · Request details')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <a class="rt-back" th:href="@{/tutor/board}">Back to the board</a>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="rt-panel">
                        <p class="rt-kicker" th:text="${request.course}">Course</p>
                        <h1 th:text="${request.topic}">Topic</h1>

                        <div class="rt-meta">
                            <span>Bounty: <strong th:text="${request.bountyValue != null ? request.bountyValue : 0}">0</strong> tokens</span>
                            <span th:text="${request.expectedEffort}">30 mins</span>
                            <span th:text="${request.preferredMeetingMethod}">Zoom</span>
                            <span th:text="${request.desiredResponseTime}">Today</span>
                        </div>

                        <p class="rt-kicker">Student's description</p>
                        <p th:text="${request.shortDescription}">Problem details</p>

                        <div class="rt-suggestion mt-4" th:if="${request.aiDiagnosticNote != null and !#strings.isEmpty(request.aiDiagnosticNote)}">
                            <h3>AI lesson scaffold</h3>
                            <p>Use these questions to guide the student. Do not hand over the final answer.</p>
                            <p class="rt-note" th:text="${request.aiDiagnosticNote}">Diagnostic note</p>
                        </div>

                        <form class="mt-4" th:if="${request.status == 'OPEN'}" th:action="@{/tutor/claim/{id}(id=${request.id})}" method="post">
                            <button type="submit" class="btn btn-rt-ok w-100">Claim this request</button>
                        </form>
                        <p class="text-muted mt-4 mb-0" th:if="${request.status != 'OPEN'}">
                            This request is <strong th:text="${request.status}">CLAIMED</strong> and cannot be claimed.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
