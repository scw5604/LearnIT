<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('LearnIT · Request details')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <a class="rt-back" th:href="@{/tutor/board}">Back to the board</a>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="rt-panel">
                        <div class="d-flex justify-content-between align-items-start gap-3">
                            <div>
                                <p class="rt-kicker" th:text="${request.course}">Course</p>
                                <h1 th:text="${request.topic}">Topic</h1>
                            </div>
                            <th:block th:replace="~{fragments/status :: status(${request.status})}"></th:block>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <div class="rt-meta">
                            <span>Bounty: <strong th:text="${request.bountyValue != null ? request.bountyValue : 0}">0</strong> tokens</span>
                            <span th:text="${request.expectedEffort}">30 mins</span>
                            <span th:text="${request.preferredMeetingMethod}">Zoom</span>
                            <span th:text="${request.desiredResponseTime}">Today</span>
                        </div>

                        <p class="rt-kicker">Student's description</p>
                        <p th:text="${request.shortDescription}">Problem details</p>

                        <p class="rt-kicker" th:if="${request.studentExplanation != null and !#strings.isEmpty(request.studentExplanation)}">What the student tried</p>
                        <p th:if="${request.studentExplanation != null and !#strings.isEmpty(request.studentExplanation)}" th:text="${request.studentExplanation}">What I tried</p>

                        <p class="mt-4" th:if="${request.status == 'CLAIMED' or request.status == 'RESOLVED'}">
                            Claimed by <strong th:text="${tutorName}">tutor1</strong>.
                            <span th:text="${request.preferredMeetingMethod}">Zoom</span><span th:if="${request.offeredMeetingTime != null}" th:text="${' on ' + #temporals.format(request.offeredMeetingTime, 'MMM d, h:mm a')}"> on Oct 14, 4:00 PM</span>.
                        </p>

                        <div th:replace="~{fragments/diagnostic-note :: scaffold(${request.aiDiagnosticNote}, 'tutor')}"></div>

                        <div class="mt-4" th:if="${request.status == 'OPEN'}">
                            <h3 class="h5">Time offers</h3>
                            <p class="text-muted" th:if="${offers == null or #lists.isEmpty(offers)}">No tutors have offered a time yet.</p>
                            <ul th:if="${offers != null and !#lists.isEmpty(offers)}">
                                <li th:each="offer : ${offers}" class="d-flex justify-content-between align-items-center gap-2">
                                    <span>
                                        <span th:text="${tutorNamesById.get(offer.tutorId)}">tutor1</span>
                                        <span th:text="${#temporals.format(offer.offeredTime, 'MMM d, h:mm a')}">Oct 14, 4:00 PM</span>
                                    </span>
                                    <form th:if="${currentUser != null and offer.tutorId == currentUser.id}" class="m-0"
                                          th:action="@{/tutor/requests/{id}/offers/{offerId}/withdraw(id=${request.id}, offerId=${offer.id})}" method="post">
                                        <button type="submit" class="btn btn-sm btn-rt-ghost">Withdraw</button>
                                    </form>
                                </li>
                            </ul>
                            <form class="mt-3" th:action="@{/tutor/requests/{id}/offers(id=${request.id})}" method="post">
                                <input type="hidden" name="from" value="details">
                                <label class="form-label" for="offeredTime">Offer a meeting time</label>
                                <input id="offeredTime" name="offeredTime" type="datetime-local" required
                                       th:classappend="${timeError} ? 'form-control mb-1 is-invalid' : 'form-control mb-3'"
                                       th:attr="aria-invalid=${timeError} ? 'true' : 'false', aria-describedby=${timeError} ? 'time-error' : null">
                                <div th:if="${timeError}" id="time-error" class="invalid-feedback d-block mb-3" th:text="${errorMessage}">Choose a future time.</div>
                                <button type="submit" class="btn btn-rt-ok w-100">Offer time</button>
                            </form>
                        </div>

                        <div class="mt-4" th:if="${request.status == 'CLAIMED' and currentUser != null and request.assignedTutorId == currentUser.id}">
                            <form th:action="@{/tutor/requests/{id}/cancel(id=${request.id})}" method="post">
                                <button type="submit" class="btn btn-rt-danger">Cancel session</button>
                            </form>
                        </div>

                        <th:block th:replace="~{fragments/timeline :: timeline(${events})}"></th:block>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
