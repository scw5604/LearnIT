<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RapidTutor - Tutor Board</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0 text-primary fw-bold">My Active Sessions</h2>
        </div>

        <div class="row mb-5">
            <div class="col-md-6 mb-4" th:each="req : ${myClaimedRequests}">
                <div class="card shadow-sm border-primary h-100">
                    <div class="card-header bg-primary text-white pt-3 pb-2 d-flex justify-content-between align-items-center">
                        <span class="badge bg-light text-primary" th:text="${req.course}">Course</span>
                        <span class="small fw-bold">CLAIMED</span>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold" th:text="${req.topic}">Topic</h5>
                        <p class="card-text text-secondary mb-3" th:text="${req.shortDescription}">Description</p>
                    </div>
                    <div class="card-footer bg-white border-top-0 pb-3 d-flex gap-2">
                        <a th:href="@{/tutor/requests/{id}(id=${req.id})}" class="btn btn-outline-primary w-100 fw-bold">View Workspace</a>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(myClaimedRequests)}" class="col-12 text-muted small py-2">
                <em>You have no active claimed sessions.</em>
            </div>
        </div>

        <hr class="mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 mb-0">Open Tutoring Requests</h2>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="row">
            <div class="col-md-6 mb-4" th:each="req : ${requests}">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                        <span class="badge bg-dark" th:text="${req.course}">Course</span>
                        <span class="text-muted small">
                        Posted: <strong th:text="${#temporals.format(req.creationTimestamp, 'MMM dd, h:mm a')}">Time</strong>
                    </span>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold" th:text="${req.topic}">Topic</h5>
                        <p class="card-text text-secondary mb-3" th:text="${req.shortDescription}">Problem Description</p>
                    </div>
                    <div class="card-footer bg-white border-top-0 pb-4 d-flex gap-2">
                        <a th:href="@{/tutor/requests/{id}(id=${req.id})}" class="btn btn-outline-primary w-50 fw-bold">View Details</a>
                        <form th:action="@{/tutor/claim/{id}(id=${req.id})}" method="post" class="w-50 m-0">
                            <button type="submit" class="btn btn-success w-100 fw-bold">Claim Request</button>
                        </form>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(requests)}" class="col-12 text-center text-muted py-5">
                <h5>No open requests at this time.</h5>
            </div>
        </div>
    </div>

</body>
</html>
