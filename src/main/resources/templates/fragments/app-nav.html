<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg rt-nav">
    <div class="container">
        <a class="navbar-brand" sec:authorize="hasRole('STUDENT')" th:href="@{/student/dashboard}">LearnIT</a>
        <a class="navbar-brand" sec:authorize="hasRole('TUTOR')" th:href="@{/tutor/board}">LearnIT</a>
        <a class="navbar-brand" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">LearnIT</a>
        <a class="navbar-brand" sec:authorize="hasAnyRole('APPLICANT', 'DECLINED')" th:href="@{/apply/status}">LearnIT</a>
        <a class="navbar-brand" sec:authorize="!isAuthenticated()" th:href="@{/login}">LearnIT</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#rtNav" aria-controls="rtNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="rtNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/student/dashboard}"
                       th:classappend="${#strings.startsWith(currentPath, '/student') and !#strings.startsWith(currentPath, '/student/knowledge')} ? 'active'">Blockers</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/student/knowledge}"
                       th:classappend="${#strings.startsWith(currentPath, '/student/knowledge')} ? 'active'">Databank</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('TUTOR')">
                    <a class="nav-link" th:href="@{/tutor/board}"
                       th:classappend="${#strings.startsWith(currentPath, '/tutor')} ? 'active'">Board</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin}"
                       th:classappend="${currentPath == '/admin'} ? 'active'">Overview</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/insights}"
                       th:classappend="${#strings.startsWith(currentPath, '/admin/insights')} ? 'active'">Insights</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/notifications}"
                       th:classappend="${#strings.startsWith(currentPath, '/notifications')} ? 'active'">
                        Notifications
                        <span class="rt-count-pill" th:if="${unreadCount > 0}" th:text="${unreadCount}">1</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('APPLICANT', 'DECLINED')">
                    <a class="nav-link" th:href="@{/apply/status}">Application</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="rt-token-pill" sec:authorize="hasAnyRole('STUDENT', 'TUTOR')" th:if="${currentUser != null}">
                    <span th:text="${currentUser.tokenBalance != null ? currentUser.tokenBalance : 0}">0</span> tokens
                </span>
                <div class="dropdown">
                    <button class="btn btn-sm btn-rt-ghost dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account">
                        <span sec:authentication="name">username</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" th:href="@{/account/password}">Password</a>
                        </li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item">Sign out</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
