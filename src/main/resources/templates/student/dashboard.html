<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('LearnIT · Blockers')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-page-header">
                <div>
                    <h1>My blockers</h1>
                    <p>What you were stuck on, and what changed.</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <a th:href="@{/student/requests}">Sessions</a>
                    <a th:href="@{/student/requests/new}" class="btn btn-rt-primary">Name a blocker</a>
                </div>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="rt-card" th:if="${#lists.isEmpty(drafts)}">
                <p class="rt-empty">Name what you're stuck on to get started.</p>
            </div>

            <div class="row g-3" th:if="${drafts != null and !#lists.isEmpty(drafts)}">
                <div class="col-md-6" th:each="draft : ${drafts}">
                    <article class="rt-card rt-request-card h-100">
                        <div class="d-flex justify-content-between align-items-start gap-2">
                            <p class="rt-kicker mb-0" th:text="${draft.course}">HCDD 412</p>
                            <span class="rt-badge rt-badge-open" th:if="${draft.outcome == 'TRYING'}">Trying</span>
                            <span class="rt-badge rt-badge-resolved" th:if="${draft.outcome == 'SOLVED'}">Solved</span>
                            <span class="rt-badge rt-badge-claimed" th:if="${draft.outcome == 'ESCALATED'}">With a tutor</span>
                        </div>
                        <h2 th:text="${draft.topic}">Topic</h2>

                        <div th:if="${draft.takeaway != null}">
                            <p class="rt-kicker">When I was stuck</p>
                            <p th:text="${draft.description}">Description</p>
                            <p class="rt-kicker">What changed</p>
                            <p th:text="${draft.takeaway}">The takeaway</p>
                        </div>
                        <p th:if="${draft.takeaway == null}" th:text="${draft.description}">Description</p>

                        <div th:replace="~{fragments/diagnostic-note :: scaffold(${draft.note}, 'duck')}"></div>
                        <div th:if="${draft.reply != null}" th:replace="~{fragments/diagnostic-note :: scaffold(${draft.reply}, 'followup')}"></div>

                        <p class="mt-3" th:if="${draft.answer != null and !#strings.isEmpty(draft.answer)}">
                            <span class="rt-kicker">Your answer</span>
                            <span th:text="${draft.answer}">I tried the first step.</span>
                        </p>

                        <form class="mt-3" th:if="${draft.outcome == 'ESCALATED' and draft.requestId != null and draft.takeaway == null and requestStatuses.get(draft.requestId) == 'RESOLVED'}"
                              th:action="@{/student/drafts/{id}/takeaway(id=${draft.id})}" method="post">
                            <label class="form-label" th:for="|takeaway-${draft.id}|">What changed</label>
                            <textarea class="form-control mb-2" rows="2" maxlength="500" required
                                      th:id="|takeaway-${draft.id}|" name="takeaway"
                                      placeholder="What do you understand now?"></textarea>
                            <button type="submit" class="btn btn-sm btn-rt-primary">Save what changed</button>
                        </form>

                        <div class="rt-actions" th:if="${draft.outcome == 'ESCALATED' and draft.requestId != null}">
                            <a th:href="@{/student/requests/{id}(id=${draft.requestId})}" class="btn btn-sm btn-rt-primary">Open the request</a>
                        </div>
                    </article>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
