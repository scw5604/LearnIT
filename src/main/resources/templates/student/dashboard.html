<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RapidTutor · Requests')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-page-header">
                <div>
                    <h1>My requests</h1>
                    <p>Track open, claimed, and resolved sessions.</p>
                </div>
                <a th:href="@{/student/requests/new}" class="btn btn-rt-primary">Post request</a>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="rt-card">
                <div class="table-responsive">
                    <table class="table rt-table mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Course</th>
                            <th>Topic</th>
                            <th>Status</th>
                            <th>Bounty</th>
                            <th>Effort</th>
                            <th>Meeting</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(requests)}">
                            <td colspan="8" class="rt-empty">No requests yet. Post a blocker to get started.</td>
                        </tr>
                        <tr th:each="req : ${requests}">
                            <td class="text-muted" th:text="${req.id}">1</td>
                            <td th:text="${req.course}">HCDD 412</td>
                            <td th:text="${req.topic}">Topic Name</td>
                            <td>
                                <span class="rt-badge rt-badge-open" th:if="${req.status == 'OPEN'}">Open</span>
                                <span class="rt-badge rt-badge-claimed" th:if="${req.status == 'CLAIMED'}">Claimed</span>
                                <span class="rt-badge rt-badge-resolved" th:if="${req.status == 'RESOLVED'}">Resolved</span>
                                <span class="rt-badge rt-badge-canceled" th:if="${req.status == 'CANCELED'}">Canceled</span>
                            </td>
                            <td th:text="${req.bountyValue != null ? req.bountyValue : 0}">0</td>
                            <td th:text="${req.expectedEffort}">15 mins</td>
                            <td th:text="${req.preferredMeetingMethod}">Zoom</td>
                            <td>
                                <div class="rt-actions">
                                    <a th:href="@{/student/requests/{id}(id=${req.id})}" class="btn btn-sm btn-rt-ghost">Details</a>
                                    <form th:if="${req.status == 'OPEN'}" th:action="@{/student/requests/{id}/cancel(id=${req.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-sm btn-rt-danger">Cancel</button>
                                    </form>
                                    <form th:if="${req.status == 'CLAIMED'}" th:action="@{/student/requests/{id}/resolve(id=${req.id})}" method="post" class="m-0">
                                        <button type="submit" class="btn btn-sm btn-rt-ok">Mark resolved</button>
                                    </form>
                                    <a th:if="${req.status == 'RESOLVED' and !reviewedRequestIds.contains(req.id)}" th:href="@{/student/requests/{id}/review(id=${req.id})}" class="btn btn-sm btn-rt-ghost">Leave review</a>
                                    <span th:if="${req.status == 'RESOLVED' and reviewedRequestIds.contains(req.id)}" class="text-muted small">Reviewed</span>
                                    <span th:if="${req.status == 'CANCELED'}" class="text-muted small">Closed</span>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
