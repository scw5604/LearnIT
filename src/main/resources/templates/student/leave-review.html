<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RapidTutor - Leave a Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Rate Your Session</h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">Did the tutor help you understand the core concept?</p>

                    <form th:action="@{/student/reviews}" th:object="${review}" method="post">
                        <!-- Hidden fields to retain the relationship mappings -->
                        <input type="hidden" th:field="*{tutorId}" />
                        <input type="hidden" th:field="*{studentId}" />

                        <div class="mb-4">
                            <label class="form-label fw-bold">Conceptual Understanding Score (1-5)</label>
                            <select class="form-select" th:field="*{score}" required>
                                <option value="5">5 - Completely understood the concept</option>
                                <option value="4">4 - Mostly understood</option>
                                <option value="3">3 - Somewhat helpful</option>
                                <option value="2">2 - Still confused</option>
                                <option value="1">1 - Did not explain the concept</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Feedback</label>
                            <textarea class="form-control" th:field="*{feedback}" rows="3" placeholder="What did the tutor explain well?"></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold">Submit Review</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
