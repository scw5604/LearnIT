<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RapidTutor · Review')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <a class="rt-back" th:href="@{/student/dashboard}">Back to requests</a>
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="rt-panel">
                        <p class="rt-kicker" th:text="${request.course}">HCDD 412</p>
                        <h1>Rate this session</h1>
                        <p class="text-muted" th:text="${request.topic}">Topic</p>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/student/reviews}" method="post">
                            <input type="hidden" name="requestId" th:value="${request.id}">

                            <div class="mb-3">
                                <label class="form-label" for="score">Understanding after the session</label>
                                <select id="score" class="form-select" name="score" required>
                                    <option value="5">5 — I understand the concept</option>
                                    <option value="4">4 — I mostly understand</option>
                                    <option value="3">3 — Somewhat helpful</option>
                                    <option value="2">2 — I am still confused</option>
                                    <option value="1">1 — The concept was not explained</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="feedback">Feedback</label>
                                <textarea id="feedback" class="form-control" name="feedback" rows="3" placeholder="What did the tutor explain well?"></textarea>
                            </div>

                            <button type="submit" class="btn btn-rt-primary w-100">Submit review</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
