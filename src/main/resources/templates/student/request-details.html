<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RapidTutor · Request details')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <a class="rt-back" th:href="@{/student/dashboard}">Back to requests</a>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="rt-panel">
                        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                            <div>
                                <p class="rt-kicker mb-1" th:text="${request.course}">HCDD 412</p>
                                <h1 th:text="${request.topic}">Topic</h1>
                            </div>
                            <span class="rt-badge rt-badge-open" th:if="${request.status == 'OPEN'}">Open</span>
                            <span class="rt-badge rt-badge-claimed" th:if="${request.status == 'CLAIMED'}">Claimed</span>
                            <span class="rt-badge rt-badge-resolved" th:if="${request.status == 'RESOLVED'}">Resolved</span>
                            <span class="rt-badge rt-badge-canceled" th:if="${request.status == 'CANCELED'}">Canceled</span>
                        </div>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <div class="rt-meta">
                            <span>Bounty: <strong th:text="${request.bountyValue != null ? request.bountyValue : 0}">0</strong> tokens</span>
                            <span th:text="${request.expectedEffort}">15 mins</span>
                            <span th:text="${request.preferredMeetingMethod}">Zoom</span>
                            <span th:text="${request.desiredResponseTime}">Today</span>
                        </div>

                        <p class="rt-kicker">Description</p>
                        <p th:text="${request.shortDescription}">Problem details</p>

                        <div class="rt-suggestion mt-4" th:if="${request.aiDiagnosticNote != null and !#strings.isEmpty(request.aiDiagnosticNote)}">
                            <h3>Socratic prep</h3>
                            <p class="rt-note" th:text="${request.aiDiagnosticNote}">Diagnostic note</p>
                        </div>

                        <form class="mt-4" th:if="${request.status == 'OPEN'}" th:action="@{/student/requests/{id}/cancel(id=${request.id})}" method="post">
                            <button type="submit" class="btn btn-rt-danger w-100">Cancel request</button>
                        </form>
                        <form class="mt-4" th:if="${request.status == 'CLAIMED'}" th:action="@{/student/requests/{id}/resolve(id=${request.id})}" method="post">
                            <button type="submit" class="btn btn-rt-ok w-100">Mark resolved and pay the tutor</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
