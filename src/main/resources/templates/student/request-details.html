<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RapidTutor - My Request Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="mb-3">
        <a th:href="@{/student/dashboard}" class="text-decoration-none text-muted fw-bold">
            &larr; Back to Dashboard
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center pt-3 pb-3">
                    <h5 class="mb-0">Request Details</h5>
                    <span class="badge bg-light text-primary" th:text="${request.status}">STATUS</span>
                </div>

                <div class="card-body p-4">
                    <div class="d-flex justify-content-between mb-4">
                        <h3 class="h5 fw-bold" th:text="${request.topic}">Topic</h3>
                        <span class="badge bg-warning text-dark fs-6" th:if="${request.bountyValue != null and request.bountyValue > 0}">
                            Bounty Offered: <span th:text="${request.bountyValue}"></span> Tokens
                        </span>
                    </div>

                    <div class="mb-4">
                        <h6 class="fw-bold text-muted text-uppercase small">My Description</h6>
                        <p class="fs-6" th:text="${request.shortDescription}">Problem details</p>
                    </div>

                    <!-- AI Pre-Session Scaffolding Display for the Student -->
                    <div class="alert alert-info border-0 shadow-sm mb-4" th:if="${request.aiDiagnosticNote != null}">
                        <h6 class="fw-bold text-primary mb-2">
                            Socratic Pre-Session Prep
                        </h6>
                        <p class="small mb-2 text-muted">Consider these guiding questions while you wait for your tutor:</p>
                        <p class="small mb-0" style="white-space: pre-wrap;" th:text="${request.aiDiagnosticNote}">
                            AI generated notes will appear here.
                        </p>
                    </div>

                    <!-- Lifecycle Actions -->
                    <div class="d-flex gap-2 mt-4" th:if="${request.status == 'OPEN'}">
                        <form th:action="@{/student/requests/{id}/cancel(id=${request.id})}" method="post" class="w-100 m-0">
                            <button type="submit" class="btn btn-outline-danger w-100 py-2 fw-bold">Cancel Request</button>
                        </form>
                    </div>

                    <div class="d-flex gap-2 mt-4" th:if="${request.status == 'CLAIMED'}">
                        <form th:action="@{/student/requests/{id}/resolve(id=${request.id})}" method="post" class="w-100 m-0">
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Mark Resolved & Payout Tutor</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
