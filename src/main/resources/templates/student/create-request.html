<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('RapidTutor · Post a request')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <a class="rt-back" th:href="@{/student/dashboard}">Back to requests</a>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="rt-panel">
                        <h1>Post a request</h1>
                        <p class="text-muted" th:if="${currentUser != null}">
                            Your balance is <strong th:text="${currentUser.tokenBalance != null ? currentUser.tokenBalance : 0}">100</strong> tokens. A bounty can be 0 to 50.
                        </p>

                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <form th:action="@{/student/requests}" th:object="${tutoringRequest}" method="post">
                            <div class="mb-3">
                                <label class="form-label" for="courseInput">Course</label>
                                <select class="form-select" th:field="*{course}" id="courseInput" required>
                                    <option th:each="course : ${courses}" th:value="${course}" th:text="${course}">HCDD 412</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="topicInput">Topic</label>
                                <input type="text" class="form-control" th:field="*{topic}" id="topicInput" required placeholder="e.g., UML Sequence Diagrams">
                                <div id="deflectionResults" class="mt-2"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="description">Problem description</label>
                                <textarea id="description" class="form-control" th:field="*{shortDescription}" rows="4" required placeholder="Describe the concept you are stuck on."></textarea>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-4">
                                    <label class="form-label" for="meeting">Meeting method</label>
                                    <select id="meeting" class="form-select" th:field="*{preferredMeetingMethod}" required>
                                        <option value="" disabled selected>Select method</option>
                                        <option value="Zoom">Zoom</option>
                                        <option value="Teams">Teams</option>
                                        <option value="Phone Call">Phone call</option>
                                        <option value="In-Person">In-person</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="urgency">Response time</label>
                                    <select id="urgency" class="form-select" th:field="*{desiredResponseTime}" required>
                                        <option value="" disabled selected>Select urgency</option>
                                        <option value="ASAP">ASAP</option>
                                        <option value="Within 2 hours">Within 2 hours</option>
                                        <option value="Today">Today</option>
                                        <option value="Not urgent">Not urgent</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label" for="effort">Session length</label>
                                    <select id="effort" class="form-select" th:field="*{expectedEffort}" required>
                                        <option value="" disabled selected>Select duration</option>
                                        <option value="Quick explanation (10-15 mins)">Quick explanation (10-15 mins)</option>
                                        <option value="Concept explanation (20-30 mins)">Concept explanation (20-30 mins)</option>
                                        <option value="Extended help (30-60 mins)">Extended help (30-60 mins)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="bounty">Priority bounty (tokens)</label>
                                <input id="bounty" type="number" class="form-control" th:field="*{bountyValue}" min="0" max="50" value="0">
                                <div class="form-text">Tokens are held until you cancel or the session is resolved.</div>
                            </div>

                            <button type="submit" class="btn btn-rt-primary w-100">Submit request</button>
                        </form>

                        <p class="text-muted small mt-4 mb-0">
                            Response times are not guaranteed. Do not include passwords, grades, a student ID, or a request to complete graded work.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>

<script>
    const topicInput = document.getElementById('topicInput');
    const courseInput = document.getElementById('courseInput');
    const deflectionResults = document.getElementById('deflectionResults');

    function clearSuggestion() {
        deflectionResults.replaceChildren();
    }

    function renderSuggestion(article) {
        clearSuggestion();
        const box = document.createElement('div');
        box.className = 'rt-suggestion';

        const title = document.createElement('h3');
        title.textContent = 'Suggested solution';

        const question = document.createElement('p');
        question.textContent = 'Past question: ' + (article.problemDescription || '');

        const solution = document.createElement('p');
        solution.textContent = article.verifiedSolution || '';

        box.append(title, question, solution);
        deflectionResults.append(box);
    }

    function searchKnowledge() {
        const query = topicInput.value.trim();
        const course = courseInput.value;
        if (query.length <= 3 || !course) {
            clearSuggestion();
            return;
        }

        const url = '/api/knowledge/search?topic=' + encodeURIComponent(query) + '&course=' + encodeURIComponent(course);
        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data.length > 0) {
                    renderSuggestion(data[0]);
                } else {
                    clearSuggestion();
                }
            })
            .catch(() => clearSuggestion());
    }

    topicInput.addEventListener('keyup', searchKnowledge);
    courseInput.addEventListener('change', searchKnowledge);
</script>
</body>
</html>
