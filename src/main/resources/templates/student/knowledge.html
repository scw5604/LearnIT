<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('LearnIT · Databank')}"></head>
<body class="rt-body">
<div class="rt-shell">
    <div th:replace="~{fragments/app-nav :: navbar}"></div>

    <main class="rt-main">
        <div class="container">
            <div class="rt-page-header">
                <div>
                    <h1>Databank</h1>
                </div>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <form class="row g-2 mb-4" method="get" th:action="@{/student/knowledge}">
                <div class="col-md-4">
                    <label class="form-label" for="course">Course</label>
                    <select id="course" name="course" class="form-select">
                        <option value="">All courses</option>
                        <option th:each="course : ${courses}" th:value="${course}" th:text="${course}"
                                th:selected="${course == selectedCourse}">HCDD 412</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label" for="topic">Topic</label>
                    <input id="topic" name="topic" class="form-control" th:value="${topicQuery}">
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-rt-primary" type="submit">Search</button>
                </div>
            </form>

            <div class="rt-card" th:if="${articles == null or #lists.isEmpty(articles)}">
                <p class="rt-empty">No notes for that search.</p>
            </div>

            <article class="rt-card rt-card-pad mb-3" th:each="article : ${articles}">
                <p class="rt-kicker mb-1" th:text="${article.course}">HCDD 412</p>
                <h2 th:text="${article.topic}">Topic</h2>
                <p class="rt-kicker" th:text="${article.kind == 'triage'} ? 'Soquacktic' : 'Course note'">Course note</p>
                <p th:unless="${article.kind == 'triage'}" th:text="${article.problemDescription}">Question</p>
                <p class="rt-note" th:text="${article.verifiedSolution}">Note</p>
            </article>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
